name: macOS
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: macos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check Swift toolchain
        run: xcrun swift --version
      - name: Test
        run: xcrun swift test
      - name: Build app bundle
        run: bash script/build_and_run.sh --build-only
